<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sphere Arena Simulation</title>
<style>
  body { margin:0; background:#222; color:#eee; font-family:sans-serif; }
  #ui { padding:8px; background:#333; display:flex; gap:10px; align-items:center; }
  canvas { background:#000; border:1px solid #555; }
  label { font-size:12px; }
  input { width:60px; }
</style>
</head>
<body>

<div id="ui">
  <label>Players: <input type="number" id="playerCount" value="20"></label>
  <label>Vision (deg): <input type="number" id="visionAngle" value="90"></label>
  <label>Vision Range: <input type="number" id="visionRange" value="120"></label>
  <label>Tick (ms): <input type="number" id="tickMs" value="30"></label>
  <button id="startBtn">Start</button>
  <span id="status"></span>
</div>

<canvas id="gameCanvas" width="900" height="650"></canvas>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
$(function(){

/* ---------------------------------------------------------
   CANVAS + GLOBALS
--------------------------------------------------------- */
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

let players = [];
let obstacles = [];
let mushrooms = [];
let spells = [];
let running = false;
let timer = null;
let globalTick = 0;

/* Timing (computed at start) */
let stealthDur, stealthCd;
let enrageDur, enrageCd;
let mushroomInterval;
let staminaDrainTicks = 0;
let staminaRegenTicks = 0;

/* ---------------------------------------------------------
   UTILS
--------------------------------------------------------- */
function r(min,max){ return Math.random()*(max-min)+min; }
function ri(min,max){ return Math.floor(r(min,max+1)); }
function rc(){ return `rgb(${ri(80,255)},${ri(80,255)},${ri(80,255)})`; }

/* ---------------------------------------------------------
   OBSTACLES
--------------------------------------------------------- */
function createObstacles(){
  obstacles = [];
  for(let i=0;i<20;i++){
    const w = ri(40,80), h = ri(40,80);
    obstacles.push({ x:ri(0,canvas.width-w), y:ri(0,canvas.height-h), w,h });
  }
}

/* ---------------------------------------------------------
   MUSHROOMS
--------------------------------------------------------- */
function spawnMushrooms(n){
  for(let i=0;i<n;i++){
    mushrooms.push({
      x:ri(40,canvas.width-40),
      y:ri(40,canvas.height-40),
      radius:0,
      growTicks:0,
      maxRadius:14,
      grown:false,
      alive:true
    });
  }
}

/* ---------------------------------------------------------
   PLAYERS
--------------------------------------------------------- */
function createPlayers(n,visionAngle,visionRange){
  players = [];
  spells = [];

  for(let i=0;i<n;i++){
    const radius = ri(10,18);
    const hasMana = Math.random()<0.20;
    const hasStealth = Math.random()<0.25;
    const hasEnrage = Math.random()<0.25;

    players.push({
      id:i,
      x:r(radius,canvas.width-radius),
      y:r(radius,canvas.height-radius),
      vx:r(-1.5,1.5),
      vy:r(-1.5,1.5),
      radius,
      health:ri(60,100),
      stamina:100,
      strength:ri(5,20),
      agility:ri(5,20),
      aggressiveness:r(0,1),
      facing:r(0,Math.PI*2),
      color:rc(),

      /* Vision */
      visionAngle:visionAngle*Math.PI/180,
      visionRange,

      /* Mana */
      hasMana,
      manaMax:hasMana?ri(40,100):0,
      mana:hasMana?ri(40,100):0,
      spellCooldown:0,

      /* Stealth */
      hasStealth,
      isStealthed:false,
      stealthTicksLeft:0,
      stealthCooldown:0,

      /* Enrage */
      hasEnrage,
      isEnraged:false,
      enrageTicksLeft:0,
      enrageCooldown:0,

      /* Speed variation */
      speedFactor:1
    });
  }
}

/* ---------------------------------------------------------
   DRAW BACKGROUND
--------------------------------------------------------- */
function drawBackground(){
  const tile=32;
  for(let y=0;y<canvas.height;y+=tile){
    for(let x=0;x<canvas.width;x+=tile){
      const g=100+((x+y)%40);
      ctx.fillStyle=`rgb(0,${g},0)`;
      ctx.fillRect(x,y,tile,tile);
      ctx.strokeStyle="rgba(0,80,0,0.3)";
      ctx.strokeRect(x,y,tile,tile);
    }
  }
  ctx.fillStyle="#555";
  ctx.strokeStyle="#222";
  obstacles.forEach(o=>{
    ctx.fillRect(o.x,o.y,o.w,o.h);
    ctx.strokeRect(o.x,o.y,o.w,o.h);
  });
}

/* ---------------------------------------------------------
   DRAW MUSHROOMS
--------------------------------------------------------- */
function drawMushrooms(){
  mushrooms.forEach(m=>{
    if(!m.alive) return;
    ctx.save();
    ctx.translate(m.x,m.y);

    const r=m.radius;
    const stemH=r*1.2;

    ctx.fillStyle="#f5e6c8";
    ctx.beginPath();
    ctx.roundRect(-r*0.3,-stemH,r*0.6,stemH,r*0.2);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(0,-stemH,r,Math.PI,0);
    ctx.fillStyle="#d00";
    ctx.fill();

    ctx.fillStyle="#fff";
    for(let i=0;i<6;i++){
      const sx=(Math.random()-0.5)*r*1.2;
      const sy=-stemH-r(0,r*0.6);
      ctx.beginPath();
      ctx.arc(sx,sy,r*0.12,0,Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
  });
}

/* ---------------------------------------------------------
   DRAW PLAYERS
--------------------------------------------------------- */
function drawPlayers(){
  players.forEach(p=>{
    ctx.save();
    ctx.globalAlpha = p.isStealthed ? 0.5 : 1.0;

    /* Vision cone (hidden in stealth) */
    if(!p.isStealthed){
      ctx.save();
      ctx.translate(p.x,p.y);
      ctx.rotate(p.facing);
      ctx.beginPath();
      ctx.moveTo(0,0);
      ctx.arc(0,0,p.visionRange,-p.visionAngle/2,p.visionAngle/2);
      ctx.closePath();
      ctx.fillStyle="rgba(255,255,255,0.05)";
      ctx.fill();
      ctx.restore();
    }

    /* Body */
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.radius,0,Math.PI*2);
    ctx.fillStyle = p.isEnraged ? "#ff0000" : p.color;
    ctx.fill();
    ctx.strokeStyle="#000";
    ctx.stroke();

    ctx.restore();

    /* Health bar */
    const barW=p.radius*2, barH=4;
    const baseY=p.y-p.radius-8;
    const hpRatio=Math.max(0,p.health)/100;

    ctx.fillStyle="#000";
    ctx.fillRect(p.x-barW/2,baseY,barW,barH);
    ctx.fillStyle=hpRatio>0.5?"#0f0":"#f00";
    ctx.fillRect(p.x-barW/2,baseY,barW*hpRatio,barH);

    /* Mana bar */
    if(p.hasMana){
      const manaRatio=p.mana/p.manaMax;
      const y2=baseY+barH+2;
      ctx.fillStyle="#000";
      ctx.fillRect(p.x-barW/2,y2,barW,barH);
      ctx.fillStyle="#00aaff";
      ctx.fillRect(p.x-barW/2,y2,barW*manaRatio,barH);
    }

    /* Stamina bar (white) */
    const staminaRatio=p.stamina/100;
    const y3=baseY+barH+2+(p.hasMana?barH+2:0);
    ctx.fillStyle="#000";
    ctx.fillRect(p.x-barW/2,y3,barW,barH);
    ctx.fillStyle="#ffffff";
    ctx.fillRect(p.x-barW/2,y3,barW*staminaRatio,barH);
  });
}

/* ---------------------------------------------------------
   DRAW SPELLS
--------------------------------------------------------- */
function drawSpells(){
  spells.forEach(s=>{
    if(!s.active) return;

    ctx.save();
    ctx.globalAlpha=0.25;
    ctx.fillStyle="#000";
    ctx.beginPath();
    ctx.moveTo(s.shadow
